services:
  api:
    build:
      context: ./apps/api
    environment:
      JOB_HUNT_ENVIRONMENT: development
      JOB_HUNT_DATABASE_URL: postgresql+psycopg://jobhunt:jobhunt@postgres:5432/jobhunt
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: jobhunt
      POSTGRES_USER: jobhunt
      POSTGRES_PASSWORD: jobhunt
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobhunt -d jobhunt"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
