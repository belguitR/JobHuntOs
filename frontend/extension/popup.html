<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Job Hunt OS Capture</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <h1>Add application</h1>
    </header>
    <p id="message" role="status">Connecting to your local workspace…</p>
    <form id="capture" hidden>
      <label
        >Save as<select id="kind">
          <option value="applications">Job / application</option>
          <option value="contacts">Contact</option>
        </select></label
      ><label>Country<select id="country" required></select></label
      ><label
        >Company<select id="company">
          <option value="">Choose company</option>
        </select></label
      ><label>Or create a company<input id="new-company" placeholder="Company name" /></label
      ><label id="title-label">Role / full name<input id="title" required maxlength="200" /></label
      ><label>Source URL<input id="url" type="url" /></label>
      <div id="job-fields">
        <label
          >Stage<select id="status">
            <option>Saved</option>
            <option>Applied</option>
          </select></label
        ><label
          >CV version<select id="resume">
            <option value="">None</option>
          </select></label
        >
      </div>
      <div id="contact-fields" hidden>
        <label>Email (if known)<input id="email" type="email" /></label
        ><label>Job title<input id="role" /></label>
      </div>
      <label>Notes<textarea id="notes" rows="3"></textarea></label
      ><button id="save" type="submit">Confirm and save</button>
    </form>
    <footer>
      <button id="detect" type="button">Enable submission hints</button
      ><small
        >Optional: Greenhouse and Lever only. Shows a badge when a page looks like a submission
        confirmation. You review and confirm every save. No general browsing history is
        collected.</small
      ><a href="http://127.0.0.1:5173" target="_blank" rel="noreferrer">Open workspace</a>
    </footer>
    <script src="popup.js"></script>
  </body>
</html>
