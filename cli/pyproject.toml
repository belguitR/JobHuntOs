[project]
name = "jobhunt-terminal"
version = "0.1.0"
description = "A local, approval-gated job-search terminal tool"
requires-python = ">=3.11"
dependencies = [
  "google-api-python-client>=2.0",
  "google-auth-oauthlib>=1.2",
]

[project.scripts]
jobhunt = "jobhunt.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
